<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Warm Speech Bubble -->
  <g filter="url(#shadow)">
    <path d="M120 150 C120 115 150 90 256 90 C362 90 392 115 392 150 C392 235 340 270 270 270 L230 330 L220 270 C150 270 120 235 120 150 Z" fill="#FFFFFF"/>
    
    <!-- Heart / Friendly Tulip inside bubble -->
    <path d="M225 180 C205 155 190 140 220 125 C238 116 256 135 256 135 C256 135 274 116 292 125 C322 140 307 155 287 180 L256 210 Z" fill="#EF4444"/>

    <!-- Sound waves -->
    <path d="M375 185 C395 195 405 215 405 235 C405 255 395 275 375 285" fill="none" stroke="#FBBF24" stroke-width="16" stroke-linecap="round"/>
    <path d="M405 160 C435 180 450 210 450 235 C450 260 435 290 405 310" fill="none" stroke="#FBBF24" stroke-width="16" stroke-linecap="round"/>

    <!-- Small Star -->
    <polygon points="145,290 152,310 173,310 156,322 162,342 145,330 128,342 134,322 117,310 138,310" fill="url(#starGrad)"/>
  </g>
</svg>
